name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore SASD.Bewerbungsmanager.sln

      - name: Build
        run: dotnet build SASD.Bewerbungsmanager.sln -c Release --no-restore

      - name: Test
        run: dotnet test --solution SASD.Bewerbungsmanager.sln -c Release --no-build
